<!-- FOR WHO -->
<section class="sec">
<div class="wrap">
<div class="hd">
<div><p class="eb">Khóa học dành cho người bận rộn muốn bắt đầu đúng cách với tiếng Anh</p><h2 class="h2">Bận đến mấy,<span class="l2">bạn vẫn nói được tiếng Anh.</span></h2><p style="font-size:22px;line-height:1.5;font-weight:700;color:#4A4260;margin-top:16px;text-wrap:balance">Nếu bạn thấy mình trong một dòng dưới đây, khóa học này được làm ra cho bạn.</p></div>
</div>
<div class="grid">
<div class="card"><div class="num" style="font-size:18px">01</div><div style="font-size:23px;line-height:1.45;font-weight:600;color:#1A1230;text-wrap:pretty">Người đi làm <strong style="color:#5D0390;font-weight:900">mất gốc</strong>, hoặc đã học nhiều năm nhưng vẫn <strong style="color:#5D0390;font-weight:900">ấp úng khi phải nói</strong>.</div></div>
<div class="card"><div class="num" style="font-size:18px">02</div><div style="font-size:23px;line-height:1.45;font-weight:600;color:#1A1230;text-wrap:pretty">Người nghe được vài từ nhưng <strong style="color:#5D0390;font-weight:900">không theo kịp</strong> khi người nước ngoài <strong style="color:#5D0390;font-weight:900">nói nhanh</strong>.</div></div>
<div class="card"><div class="num" style="font-size:18px">03</div><div style="font-size:23px;line-height:1.45;font-weight:600;color:#1A1230;text-wrap:pretty">Người <strong style="color:#5D0390;font-weight:900">cần dùng tiếng Anh ở công ty</strong>: họp, email, trình bày, làm việc với đối tác.</div></div>
<div class="card"><div class="num" style="font-size:18px">04</div><div style="font-size:23px;line-height:1.45;font-weight:600;color:#1A1230;text-wrap:pretty">Người muốn <strong style="color:#5D0390;font-weight:900">tự tin</strong> khi đi du lịch, đi công tác, <strong style="color:#5D0390;font-weight:900">giao tiếp với người nước ngoài</strong> trong cuộc sống.</div></div>
<div class="card"><div class="num" style="font-size:18px">05</div><div style="font-size:23px;line-height:1.45;font-weight:600;color:#1A1230;text-wrap:pretty">Sinh viên, người sắp đi làm muốn <strong style="color:#5D0390;font-weight:900">phỏng vấn tự tin</strong>, có tiếng Anh để <strong style="color:#5D0390;font-weight:900">chọn việc tốt hơn, thu nhập cao hơn</strong>.</div></div>
<div class="card"><div class="num" style="font-size:18px">06</div><div style="font-size:23px;line-height:1.45;font-weight:600;color:#1A1230;text-wrap:pretty">Người đã thử nhiều app, nhiều khóa nhưng <strong style="color:#5D0390;font-weight:900">bỏ dở giữa chừng</strong> vì không có lộ trình rõ và <strong style="color:#5D0390;font-weight:900">không có thời gian</strong>.</div></div>
</div>
</div>
</section>


<!-- PROBLEMS -->
<section class="sec warm">
<div class="wrap">
<div class="hd">
<div><p class="eb">Có phải bạn cũng vậy?</p><h2 class="h2">“Mình học rồi mà.<span class="l2">Sao lúc cần vẫn không nói được?”</span></h2></div>
<p class="hd-lead">Câu trả lời có sẵn trong đầu, nhưng cứ mắc lại trước khi thành lời. Bạn không thiếu kiến thức, bạn thiếu <strong style="color:#5D0390;font-weight:800;background:linear-gradient(transparent 62%,#FFD3A1 62%)">một lộ trình nói theo chủ đề</strong> và <strong style="color:#5D0390;font-weight:800;background:linear-gradient(transparent 62%,#FFD3A1 62%)">người sửa cho bạn mỗi buổi</strong>.</p>
</div>
<div class="grid g4"><div class="card"><div class="ct">Học ngữ pháp nhiều năm nhưng rất sợ khi phải nói</div><div class="sm"><strong class="p">LEC giúp bạn:</strong> mỗi buổi luyện nói theo <span class="hk">một chủ đề giao tiếp thực tế</span>. Ngữ pháp đi kèm câu nói, và <span class="hk">giáo viên sửa ngay</span> khi bạn nói sai.</div></div><div class="card"><div class="ct">Nghe không kịp khi người nước ngoài nói nhanh</div><div class="sm"><strong class="p">LEC giúp bạn:</strong> luyện <span class="hk">nghe chủ động theo 24 chủ đề</span> mỗi level, quen dần với tốc độ nói tự nhiên. Mỗi level có thêm <span class="hk">3 buổi học cùng giáo viên nước ngoài</span>.</div></div><div class="card"><div class="ct">Phát âm sai mà không biết sai ở đâu</div><div class="sm"><strong class="p">LEC giúp bạn:</strong> lớp nhỏ 1-6, 1-2 hoặc 1-1 nên <span class="hk">giáo viên nghe và sửa phát âm cho từng người</span>. Phần IPA học theo video hướng dẫn của Cô Lucy, giáo viên ôn lại trên lớp.</div></div><div class="card"><div class="ct">Học xong là quên</div><div class="sm"><strong class="p">LEC giúp bạn:</strong> <span class="hk">luyện tập hằng ngày có hướng dẫn</span> của giáo viên và trợ giảng, <span class="hk">kiểm tra giữa kỳ và cuối kỳ</span>, nhận tài liệu đầy đủ sau mỗi buổi học.</div></div><div class="card"><div class="ct">Mất gốc, sợ không theo kịp</div><div class="sm"><strong class="p">LEC giúp bạn:</strong> <span class="hk">Level 0 Nhập Môn</span> dành riêng cho người mất gốc. LEC cam kết: <span class="hk">người mới tinh, chưa biết gì cũng học được</span>.</div></div><div class="card"><div class="ct">Lịch làm việc thất thường, sợ lỡ buổi</div><div class="sm"><strong class="p">LEC giúp bạn:</strong> <span class="hk">13 ca học từ 5:00 đến 22:00</span>, chọn 1 trong 3 cặp thứ. Lỡ buổi vẫn có <span class="hk">bản ghi hình</span> để xem lại bất cứ lúc nào.</div></div><div class="card"><div class="ct">Ngại nói, sợ sai trước người khác</div><div class="sm"><strong class="p">LEC giúp bạn:</strong> lớp nhỏ, không khí <span class="hk">vui vẻ, tận tâm</span>. Bạn được tham gia <span class="hk">CLB Speak Up trọn đời</span> để luyện nói cùng mọi người.</div></div><div class="card"><div class="ct">Sợ học mãi không tiến bộ</div><div class="sm"><strong class="p">LEC giúp bạn:</strong> lộ trình rõ ràng theo từng level, <span class="hk">đội ngũ 3 kèm 1</span> (giáo viên, trợ giảng, Cô Lucy) đồng hành. Học đúng lộ trình, <span class="hk">sau mỗi 3 tháng bạn lên 1 level</span>.</div></div></div>
<div style="margin-top:18px;background:#5D0390;border-radius:20px;padding:24px 26px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between"><div style="flex:1 1 360px;min-width:0;font-size:22px;line-height:1.35;font-weight:800;color:#FFFFFF">Gặp từ 2 vấn đề trở lên? <span style="color:#FFC27A">Khóa giao tiếp cùng giáo viên LEC dành cho bạn!</span> Chọn level để xem lộ trình của bạn.</div><a href="#chon-level" class="btn btn-o">Chọn level của bạn</a></div>
</div>
</section>

<!-- ALAS -->
<section class="sec" id="alas">
<div class="wrap">
<div class="hd" style="flex-direction:column;align-items:stretch;gap:16px">
<div style="flex:none;min-width:0"><p class="eb">Bước ngoặt trong cách học</p><h2 class="h2">3 thay đổi nhỏ giúp bạn<span class="l2" style="white-space:normal">từ <span style="color:#F7941D">không biết</span> thành <span style="color:#F7941D">biết</span>, từ <span style="color:#F7941D">biết</span> thành <span style="color:#F7941D">nói được</span>.</span></h2></div>
<p class="hd-lead" style="flex:none;max-width:none;margin-left:0;font-size:19px">Phần lớn người học không thiếu kiến thức. Điều còn thiếu là cách biến những gì đã học thành phản xạ. Cô Lucy gói 3 thay đổi này thành một phương pháp riêng, dùng xuyên suốt mọi buổi học tại LEC.</p>
</div>
<div class="grid g3">
<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="num" style="margin:0">01</div><div class="ct" style="font-size:25px">Nghe bằng toàn bộ sự chú ý</div><div class="sm" style="font-size:18px;line-height:1.55"><span style="font-weight:800;color:#8A80A0">Thay vì:</span> bật bài nghe cho có, nghe xong không đọng lại gì.</div><div class="sm" style="font-size:18px;line-height:1.55"><span class="p" style="font-weight:800">Giờ là:</span> nghe để hiểu và biết cách bắt trọng âm, ngữ điệu, cách nối âm và nuốt âm của người bản xứ.</div></div>
<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="num" style="margin:0">02</div><div class="ct" style="font-size:25px">Học từ thành cụm, dùng được ngay</div><div class="sm" style="font-size:18px;line-height:1.55"><span style="font-weight:800;color:#8A80A0">Thay vì:</span> học từng từ rời rồi loay hoay ghép thành câu khi cần nói.</div><div class="sm" style="font-size:18px;line-height:1.55"><span class="p" style="font-weight:800">Giờ là:</span> nhớ cả cụm như <em>“Could you say that again?”</em>, cần là bật ra ngay.</div></div>
<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="num" style="margin:0">03</div><div class="ct" style="font-size:25px">Nghe xong là nói ngay</div><div class="sm" style="font-size:18px;line-height:1.55"><span style="font-weight:800;color:#8A80A0">Thay vì:</span> đợi dịch từ tiếng Việt sang rồi mới dám mở miệng.</div><div class="sm" style="font-size:18px;line-height:1.55"><span class="p" style="font-weight:800">Giờ là:</span> nhại lại, kể lại được rồi nói về chính mình bằng các câu vừa nghe.</div></div>
</div>
<div style="margin-top:28px;background:linear-gradient(140deg,#6A0AA3 0%,#5D0390 55%,#3E0263 100%);color:#FFFFFF;border-radius:26px;padding:34px 30px">
<div style="font-size:13px;font-weight:900;letter-spacing:.12em;color:#FFC27A">PHƯƠNG PHÁP ĐỘC QUYỀN CỦA CÔ LUCY VÀ LUCINA ENGLISH CLASS</div>
<div style="font-size:40px;line-height:1.1;font-weight:900;margin-top:8px">ALAS</div>
<div style="font-size:clamp(19px,2.2vw,24px);line-height:1.35;font-weight:900;margin-top:10px;text-wrap:balance">KHÔNG ĐƠN GIẢN LÀ HỌC, MÀ LÀ <span style="color:#FFC27A">HỌC CHUẨN PHƯƠNG PHÁP HIỆU QUẢ!</span></div><div style="font-size:16px;font-weight:700;color:#E2D5EF;margin-top:4px">Đã được chứng minh trên hơn 1.000 học viên thành công</div>
<div style="font-size:21px;font-weight:800;color:#F1E6FA;margin-top:4px">Active Listening &amp; Active Speaking · Nghe chủ động, nói chủ động</div>
<div style="font-size:16px;line-height:1.6;color:#E2D5EF;margin-top:10px;max-width:760px">Đã được ứng dụng cho hơn 1.000 học viên của Lucina English Class. Khác với lối học thụ động, ALAS đặt bạn vào trạng thái chủ động ở cả đầu vào lẫn đầu ra.</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:24px">
<div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:20px">
<div style="font-size:12px;font-weight:900;letter-spacing:.08em;color:#FFC27A">ĐẦU VÀO</div>
<div style="font-size:22px;font-weight:900;margin-top:4px">Active Listening · Nghe chủ động</div>
<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px"><div class="li" style="font-size:16px;line-height:1.5;color:#F1E6FA"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#FFC27A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Nghe hiểu bằng toàn bộ sự chú ý, bắt trọng âm và ngữ điệu câu</span></div><div class="li" style="font-size:16px;line-height:1.5;color:#F1E6FA"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#FFC27A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Nhận ra nối âm, nuốt âm, thứ tạo nên “ngữ điệu bản xứ”</span></div><div class="li" style="font-size:16px;line-height:1.5;color:#F1E6FA"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#FFC27A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Ghi nhớ cụm từ nguyên khối thay vì từng từ rời</span></div></div>
<div style="margin-top:12px;font-size:15px;font-weight:700;color:#FFC27A">Kết quả: tai quen âm thanh có nghĩa, não lưu cả khối ngôn ngữ.</div>
</div>
<div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:20px">
<div style="font-size:12px;font-weight:900;letter-spacing:.08em;color:#FFC27A">ĐẦU RA</div>
<div style="font-size:22px;font-weight:900;margin-top:4px">Active Speaking · Nói chủ động</div>
<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px"><div class="li" style="font-size:16px;line-height:1.5;color:#F1E6FA"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#FFC27A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Nghe hiểu xong là bật lại ngay: nhại theo, kể lại hoặc đáp ngắn</span></div><div class="li" style="font-size:16px;line-height:1.5;color:#F1E6FA"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#FFC27A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Dùng lại chính cụm từ vừa nghe, không đợi dịch từ tiếng Việt</span></div><div class="li" style="font-size:16px;line-height:1.5;color:#F1E6FA"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#FFC27A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Lặp đi lặp lại để nghe gì là có sẵn mẫu câu để nói</span></div></div>
<div style="margin-top:12px;font-size:15px;font-weight:700;color:#FFC27A">Kết quả: nói tự nhiên, nhanh và tự tin hơn, bớt ngập ngừng.</div>
</div>
</div>
<div style="font-size:15px;font-weight:900;letter-spacing:.06em;color:#FFC27A;margin-top:28px">4 BƯỚC ALAS TRONG MỖI BUỔI HỌC</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-top:12px">
<div style="background:#FFFFFF;color:#1A1230;border-radius:16px;padding:16px"><div style="font-size:30px;font-weight:900;color:#F7941D;line-height:1">1</div><div style="font-size:18px;font-weight:900;margin-top:6px">Nghe hiểu</div><div style="font-size:13px;font-weight:700;color:#8A80A0">Input · Comprehend</div><div style="font-size:15px;line-height:1.5;color:#4A4260;margin-top:6px">Nghe giáo viên giảng tình huống, từ vựng và câu mẫu cho đến khi hiểu rõ.</div></div>
<div style="background:#FFFFFF;color:#1A1230;border-radius:16px;padding:16px"><div style="font-size:30px;font-weight:900;color:#F7941D;line-height:1">2</div><div style="font-size:18px;font-weight:900;margin-top:6px">Bắt chước</div><div style="font-size:13px;font-weight:700;color:#8A80A0">Shadow · Repeat</div><div style="font-size:15px;line-height:1.5;color:#4A4260;margin-top:6px">Nói theo từng câu, nhại đúng nhấn nhá và ngữ điệu, giáo viên sửa ngay.</div></div>
<div style="background:#FFFFFF;color:#1A1230;border-radius:16px;padding:16px"><div style="font-size:30px;font-weight:900;color:#F7941D;line-height:1">3</div><div style="font-size:18px;font-weight:900;margin-top:6px">Tái tạo</div><div style="font-size:13px;font-weight:700;color:#8A80A0">Retell · Reconstruct</div><div style="font-size:15px;line-height:1.5;color:#4A4260;margin-top:6px">Tự nói lại câu, ghép lại hội thoại mà không nhìn chữ.</div></div>
<div style="background:#FFFFFF;color:#1A1230;border-radius:16px;padding:16px"><div style="font-size:30px;font-weight:900;color:#F7941D;line-height:1">4</div><div style="font-size:18px;font-weight:900;margin-top:6px">Cá nhân hóa</div><div style="font-size:13px;font-weight:700;color:#8A80A0">Personalize · Apply</div><div style="font-size:15px;line-height:1.5;color:#4A4260;margin-top:6px">Dùng câu vừa học để nói về cuộc sống, công việc của chính bạn.</div></div>
</div>
<div style="font-size:15px;line-height:1.6;color:#E2D5EF;margin-top:22px;max-width:820px">ALAS không phải đường tắt và không biến bạn thành “thần đồng” sau một đêm. Nhưng nó cho bạn chiếc chìa khóa để mỗi ngày tiến thêm một bước, cho đến khi tiếng Anh thành phản xạ tự nhiên.</div>
</div>
</div>
</section>

<section class="sec lav" id="cau-chuyen" style="padding:48px 0 64px">
<div class="wrap" style="max-width:960px">
<p class="eb">Câu chuyện người sáng lập</p>
<h2 class="h2" style="text-wrap:balance">Từ một vùng quê Nghệ An, tiếng Anh đã đưa mình đi xa hơn mình từng nghĩ</h2>
<div class="st-open"><figure style="margin:0;border-radius:18px;overflow:hidden;box-shadow:0 14px 34px rgba(93,3,144,.14)"><img src="assets/102ce8d51208a0c7ee4383a810496b2a.jpg" alt="Cô Lucy tại văn phòng Lucina English Class" loading="lazy" style="display:block;width:100%;height:100%;object-fit:cover;object-position:center 70%;aspect-ratio:3/4"></figure><div style="background:#FFFFFF;border-left:5px solid #F7941D;border-radius:16px;padding:20px 22px;font-size:19px;line-height:1.65;font-style:italic;color:#3A2F52;align-self:center">Mình là Nhung Lucy (Cô Lucy Tiếng Anh Giao Tiếp). Mình lớn lên ở một vùng quê nghèo của Nghệ An. Hồi ấy, mình chưa biết tiếng Anh sẽ đưa mình đi đâu. Mình chỉ nhớ mỗi lần hiểu thêm một chữ, mình lại háo hức muốn học chữ tiếp theo. Và trong mình luôn mang một hoài bão: <strong style="color:#5D0390">Tiếng Anh sẽ thay đổi cuộc sống của mình!</strong></div></div>
<div class="st-more">
<div style="display:flex;flex-direction:column;gap:14px;margin-top:24px;font-size:18px;line-height:1.75;color:#2E2640">
<h3 style="font-size:24px;line-height:1.3;font-weight:900;color:#5D0390;margin:8px 0 0">Mình cũng bắt đầu từ những điều nhỏ nhặt nhất, như bạn hôm nay</h3>
<p style="margin:0">Ngày còn ở quê, mình có ít cơ hội học tập và hiếm khi có người chỉ cho mình nên bắt đầu từ đâu, hay làm gì khi học mãi vẫn chưa hiểu. Vậy mà mình mê tiếng Anh. Gặp một từ mới, mình muốn đọc cho đúng, hiểu cho rõ, rồi thử dùng từ ấy để nói một điều của riêng mình. Có những câu mình đọc đi đọc lại. Đến khi hiểu ra, mình vui đến mức muốn học thêm ngay một chút nữa.</p>
<p style="margin:0">Mình cứ miệt mài như thế, với từng chữ mình có cơ hội được học. Rồi mình bước chân vào <strong>Đại học Ngoại thương</strong>. Sau này, mình làm việc tại các công ty toàn cầu, có cơ hội làm việc với nhiều chủ doanh nghiệp và nhiều lần được ghi nhận là <strong>MVP của tháng, của quý</strong>.</p>
<div class="sg"><div class="sg-l">Những năm đi làm tại công ty toàn cầu</div><div class="sg-g sg3"><figure class="sg-f sg-wide"><img src="assets/3e13deabd20ee8b6c7dd2fed01ec5a9d.jpg" alt="Họp nhóm kinh doanh tại công ty toàn cầu" loading="lazy" style="aspect-ratio:21/9;object-position:center 55%"><figcaption>Những buổi họp nhóm, trình bày số liệu bằng tiếng Anh ở công ty toàn cầu</figcaption></figure><figure class="sg-f"><img src="assets/cc28941567d88a116921b412cc854e23.jpg" alt="MVP of the Week · dự án D2C" loading="lazy" style="aspect-ratio:4/3;object-position:center"><figcaption>MVP of the Week · dự án D2C</figcaption></figure><figure class="sg-f"><img src="assets/e43a1c9bb756ed71f389cad4714e2ea2.jpg" alt="Nhân sự kinh doanh xuất sắc nhất dự án D2C" loading="lazy" style="aspect-ratio:4/3;object-position:center"><figcaption>Nhân sự kinh doanh xuất sắc nhất dự án D2C</figcaption></figure><figure class="sg-f"><img src="assets/b50d1bcc9eccf83bf261d5ec48d9dc52.jpg" alt="Khách mời sự kiện One Accesstrade · D2C Business Development Leader" loading="lazy" style="aspect-ratio:4/3;object-position:center 67%"><figcaption>Khách mời sự kiện One Accesstrade · D2C Business Development Leader</figcaption></figure><figure class="sg-f"><img src="assets/2956e966a63140b6b89c2349b4408248.jpg" alt="Bằng khen tại Year End Party" loading="lazy" style="aspect-ratio:4/3;object-position:center 35%"><figcaption>Bằng khen tại Year End Party</figcaption></figure><figure class="sg-f"><img src="assets/097625a7ddd1a420322dab6b1363eb45.jpg" alt="Lễ ký kết đối tác truyền thông & kinh doanh chiến lược" loading="lazy" style="aspect-ratio:4/3;object-position:center"><figcaption>Lễ ký kết đối tác truyền thông & kinh doanh chiến lược</figcaption></figure><figure class="sg-f"><img src="assets/a5c38600ceb30c3ee235496a6c398f65.jpg" alt="Gặp gỡ đối tác chủ doanh nghiệp" loading="lazy" style="aspect-ratio:4/3;object-position:center"><figcaption>Gặp gỡ đối tác chủ doanh nghiệp</figcaption></figure></div></div>
<p style="margin:0">Trong những năm đi làm, mình mới thấy những chữ mình từng say mê học ở quê đã theo mình đi xa đến thế nào. Mình dùng tiếng Anh để đặt câu hỏi, để trình bày ý tưởng và để làm việc cùng những người mà cô gái ngày ấy chưa từng nghĩ mình sẽ có dịp gặp.</p>
<div class="sg"><div class="sg-l">Tiếng Anh đưa mình đi xa hơn mình từng nghĩ</div><div class="sg-g sg4"><figure class="sg-f"><img src="assets/cba7ef08f0b6a900a886b95841415567.jpg" alt="Kuala Lumpur, Malaysia" loading="lazy" style="aspect-ratio:3/4;object-position:center 60%"><figcaption>Kuala Lumpur, Malaysia</figcaption></figure><figure class="sg-f"><img src="assets/99fadf70341f058005e117a38c3eea5e.jpg" alt="Batu Caves, Malaysia" loading="lazy" style="aspect-ratio:3/4;object-position:center 75%"><figcaption>Batu Caves, Malaysia</figcaption></figure><figure class="sg-f"><img src="assets/d76e042861f019d829e0bbbf71c61aee.jpg" alt="Halloween cùng các Giáo sư Đại học VinUni" loading="lazy" style="aspect-ratio:3/4;object-position:center"><figcaption>Halloween cùng các Giáo sư Đại học VinUni</figcaption></figure><figure class="sg-f"><img src="assets/018df078b3ffd5198b0e4ef38b1d72ef.jpg" alt="Những buổi trò chuyện cùng đối tác nước ngoài" loading="lazy" style="aspect-ratio:3/4;object-position:center"><figcaption>Những buổi trò chuyện cùng đối tác nước ngoài</figcaption></figure></div></div>
<h3 style="font-size:24px;line-height:1.3;font-weight:900;color:#5D0390;margin:12px 0 0">Mình muốn việc học có một chỗ trong cuộc sống bạn đang có, mà không làm mất đi nhịp sống của bạn</h3>
<p style="margin:0">Có thể bạn đã từng gặp những khoảnh khắc như thế này. Đi du lịch, bạn hỏi đường, người ta trả lời nhanh quá, bạn chỉ kịp <strong>mỉm cười gật đầu</strong> dù vẫn chưa biết phải rẽ ở đâu. Vào nhà hàng, bạn chỉ tay vào ảnh món ăn vì <strong>sợ nói sai</strong>. Con hỏi một câu tiếng Anh trong sách, bạn lúng túng chưa biết giải thích thế nào.</p>
<p style="margin:0">Ở công ty, sếp hay đối tác nước ngoài hỏi một câu, bạn hiểu ý nhưng <strong>câu trả lời không bật ra được</strong>. Một email ngắn cũng mất cả buổi để viết. Trong cuộc họp, bạn có ý muốn góp, nhưng đến lúc nghĩ ra cách nói thì mọi người đã chuyển sang chuyện khác. Rồi có một cơ hội thăng tiến, một chuyến công tác, một công việc tốt hơn đòi hỏi tiếng Anh, và bạn <strong>lặng lẽ lùi lại</strong>.</p>
<p style="margin:0">Tối về, bạn mở một bài tiếng Anh. Nghe được vài phút, bạn nhận ra mình đã quá mệt để tập trung. Bạn tự nhủ mai sẽ học. Rồi ngày mai cũng kín lịch như hôm nay. Không phải vì bạn lười. Chỉ là bạn chưa có một cách học <strong>vừa với một ngày đã kín lịch</strong>.</p>
<p style="margin:0">Khi nghĩ về một lớp tiếng Anh cho người bận rộn, mình nghĩ đến những ngày như thế. Mình muốn bạn được học từ những tình huống bạn thật sự gặp, như hỏi lại khi nghe chưa rõ hay góp một ý kiến trong cuộc họp. Mình cũng muốn bạn có một lộ trình đủ rõ để dù công việc cuốn đi vài ngày, khi quay lại, bạn vẫn biết có thể học tiếp từ đâu.</p>
<p style="margin:0">Đó là lý do mình sáng lập và trực tiếp phụ trách chuyên môn tại <strong>Lucina English Class</strong>, chuỗi lớp tiếng Anh online dành cho người bận rộn.</p>
<div class="sg"><div class="sg-l">Lucina English Class hôm nay</div><div class="sg-g sg4"><figure class="sg-f sg-wide"><img src="assets/afb6a410ccba2312b66e45dac5787cc2.jpg" alt="Lễ trao chứng nhận cuối khóa" loading="lazy" style="aspect-ratio:21/9;object-position:center 70%"><figcaption>Lễ trao chứng nhận cuối khóa cùng học viên</figcaption></figure><figure class="sg-f sg-wide"><img src="assets/5c3658a9e93d4b5a20024b396bd8ee92.jpg" alt="Các buổi giao lưu tiếng Anh online của Lucina English Class" loading="lazy" style="aspect-ratio:1594/876"><figcaption>Các buổi giao lưu tiếng Anh online cùng giáo viên bản xứ và quốc tế của Lucina English Class</figcaption></figure><figure class="sg-f"><img src="assets/e6440612556f088592b0aabb4ba1f3d5.jpg" alt="Đội ngũ Lucina English Class" loading="lazy" style="aspect-ratio:16/10;object-position:center"><figcaption>Đội ngũ Lucina English Class</figcaption></figure><figure class="sg-f"><img src="assets/c4325b6225830a09d22d80a803941833.jpg" alt="Gặp gỡ bạn bè quốc tế" loading="lazy" style="aspect-ratio:16/10;object-position:center 40%"><figcaption>Gặp gỡ bạn bè quốc tế</figcaption></figure><figure class="sg-f"><img src="assets/952d0804e11e6cc0c0aff410cfe8eec3.jpg" alt="Từ bạn bè trở thành người đồng hành trong công việc" loading="lazy" style="aspect-ratio:16/10;object-position:center"><figcaption>Từ bạn bè trở thành người đồng hành trong công việc</figcaption></figure><figure class="sg-f"><img src="assets/c3100b39b05b2771087bbb07451c8c93.jpg" alt="Văn phòng của LEC tại Hà Nội" loading="lazy" style="aspect-ratio:16/10;object-position:center 60%"><figcaption>Văn phòng của LEC tại Hà Nội</figcaption></figure></div></div>
<h3 style="font-size:24px;line-height:1.3;font-weight:900;color:#5D0390;margin:12px 0 0">Gần 5 năm xây dựng chuỗi Tiếng Anh cho người bận rộn, để bạn thay đổi thật sự khả năng tiếng Anh của mình</h3>
<p style="margin:0">Gần 5 năm qua, mình cùng đội ngũ Lucina English Class xây dựng chuỗi <strong>Tiếng Anh cho người bận rộn</strong>: từ những buổi livestream miễn phí, các lớp học cùng giáo viên, đến từng lộ trình theo level. Mỗi bài học, mình đều nghĩ đến một người vừa kết thúc ngày làm việc, chỉ còn một chút thời gian cho bản thân. Nếu tối nay người ấy học được một điều nhỏ và ngày mai có dịp dùng ngay, họ sẽ có lý do để muốn học tiếp.</p>
<p style="margin:0">Có lẽ bạn sẽ nhận ra mình đã tiến bộ vào một lúc rất bình thường. Ai đó nói hơi nhanh và lần này bạn chủ động hỏi lại. Trong cuộc họp, bạn nói được ý mình muốn góp khi mọi người vẫn đang bàn về chuyện đó. Những khoảnh khắc ấy có thể chỉ kéo dài vài giây, nhưng bạn biết mình đã làm được điều mà trước đây thường bỏ qua vì ngại.</p>
<p style="margin:0">Nếu bạn đã nhiều lần muốn học lại tiếng Anh, mình mong bạn có thể bắt đầu với khoảng thời gian bạn có hôm nay. Ngày trước, mình đã bắt đầu bằng niềm vui hiểu thêm một chữ. Mình mong bạn cũng sẽ tìm thấy niềm vui ấy khi lần đầu dùng được điều vừa học.</p>
</div>

    var FAQ = [["Khóa học này học như thế nào?", "Bạn học trực tuyến qua Google Meet và Zoom cùng giáo viên chính của Lucina English Class, 2 buổi/tuần, mỗi buổi 1,5 giờ.\nMỗi level kéo dài 3 tháng, gồm:\n• 24 buổi học trực tiếp cùng giáo viên\n• Luyện tập hằng ngày có hướng dẫn\n• 2 bài kiểm tra giữa kỳ và cuối kỳ\n• 3 buổi học cùng giáo viên nước ngoài\nMỗi buổi đều có bản ghi hình để xem lại và tài liệu đầy đủ sau buổi học."], ["Học online có hiệu quả bằng học trực tiếp không?", "Lớp học online của LEC là lớp live: giáo viên dạy, hỏi đáp và sửa lỗi cho bạn ngay trong buổi, không phải video quay sẵn. Lớp nhỏ (1-6, 1-2 hoặc 1-1) nên ai cũng được nói và được sửa.\nHọc online còn giúp bạn tiết kiệm thời gian đi lại, học được ở bất cứ đâu, và có bản ghi hình để xem lại phần chưa nắm chắc."], ["Một buổi học 90 phút gồm những gì?", "• Warm-up (5 phút): minigame hoặc trò chuyện khởi động.\n• Phát âm (10 phút): cặp âm IPA và mẹo phát âm của buổi.\n• Ngữ pháp (10 phút): ôn nhanh và đi sâu phần bạn chưa chắc.\n• Từ vựng & nghe chủ động (25 phút): đọc hiểu, nghe đọc lại, nghe chép, nghe nói lại không nhìn.\n• Nói & phản xạ (40 phút): nói theo từng câu, nói lại cả bài, hỏi đáp và freetalk, giáo viên sửa kỹ cho từng bạn.\nRiêng Level 0 Nhập Môn dành thêm thời gian cho phát âm và ngữ pháp nền."], ["Sau mỗi buổi học tôi nhận được gì?", "• Link bài giảng và audio của buổi học\n• Bản ghi hình và ghi chú buổi học\n• 5 worksheet: từ vựng, ngữ pháp, phát âm, nghe, nói\nBạn sở hữu trọn đời toàn bộ tài liệu trong khóa học."], ["Bài tập về nhà có nhiều không? Ai chấm bài?", "Sau mỗi buổi, bạn làm các worksheet có sẵn và quay tối đa 2 video ngắn (phát âm và nói). Trợ giảng chấm, chữa và trả kết quả cho bạn trước buổi học tiếp theo, nên bạn biết rõ mình sai ở đâu để sửa ngay."], ["Khóa có học với giáo viên nước ngoài không?", "Có. Mỗi level có 3 buổi học cùng giáo viên nước ngoài ngay trong khóa. Ngoài ra, bạn được tham gia CLB Speak Up trọn đời với các buổi giao lưu và contest hàng tháng cùng giáo viên nước ngoài."], ["Tôi mất gốc hoàn toàn, có học được không?", "Được. LEC cam kết: người mới tinh, chưa biết gì cũng học được.\nBạn bắt đầu từ Level 0 Nhập Môn (A0 – A1), khóa “3 Tháng Xóa Mất Gốc Nghe Nói Tiếng Anh”: học từ bảng chữ cái, số đếm, IPA, các thì và cấu trúc giao tiếp thực tế, 300 từ vựng sơ cấp, luyện phản xạ trả lời nhanh, đúng, đủ."], ["Tôi lớn tuổi, lâu rồi không học tiếng Anh, có theo kịp không?", "Theo kịp. Lớp nhỏ nên giáo viên đi theo tốc độ của từng bạn, có bản ghi hình để xem lại và trợ giảng chấm chữa bài sau mỗi buổi. Nhiều học viên của LEC là cô chú lớn tuổi, đi làm bận rộn và bắt đầu lại từ đầu."], ["Làm sao biết mình đang ở level nào?", "Bạn chọn mô tả giống mình nhất ở phần “Bạn đang ở level nào?” đầu trang để xem lộ trình tương ứng.\nĐể chắc chắn hơn, bạn làm bài test đầu vào miễn phí của Cô Lucy: 20 câu tự động, khoảng 6 phút, có phần nghe và phát âm. Kết quả A0 → Level 0, A1 → Level 1, A2 → Level 2, B1 → Level 3, B2 → Level 4.", [["Làm bài test trình độ", "/bai-test"]]], ["Nên học Giao Tiếp Đời Sống hay Giao Tiếp Công Việc?", "• Đời Sống: giao tiếp hằng ngày, trò chuyện với người nước ngoài, dùng khi đi du lịch, du học, định cư. Có 5 level, từ Nhập Môn (A0) tới Level 4 (C1).\n• Công Việc: trao đổi với sếp, đồng nghiệp, đối tác nước ngoài; phỏng vấn, họp hành, thuyết trình, công tác. Có 4 level; Level 1–3 có thể thêm 20% nội dung theo ngành nghề của bạn, Level 4 thiết kế riêng theo ngành.\nNếu bạn đang mất gốc, hãy bắt đầu từ Level 0 Đời Sống."], ["Học xong bao lâu thì lên level? Làm sao biết mình tiến bộ?", "Học đúng lộ trình, sau mỗi 3 tháng bạn hoàn thành 1 level; sau mỗi 6 tháng, level của bạn được củng cố vững vàng và hoàn thiện hơn.\nBạn thấy rõ tiến bộ qua bài kiểm tra giữa kỳ và cuối kỳ, bài tập được chấm chữa sau mỗi buổi, và các buổi Cô Lucy test level định kỳ.\nLưu ý: A0 – C1 là mức mục tiêu của chương trình theo khung CEFR, không phải chứng chỉ ngoại ngữ độc lập. Tiến bộ của mỗi người phụ thuộc điểm xuất phát và mức độ luyện tập."], ["Học xong một level thì học tiếp thế nào?", "Bạn học tiếp level kế tiếp trong lộ trình (Đời Sống: Nhập Môn → Level 1 → 2 → 3 → 4; Công Việc: Level 1 → 4). Nếu muốn học dài hơi, combo khóa 6 tháng (48 buổi) có mức ưu đãi lớn hơn so với đăng ký từng khóa 3 tháng."], ["Học xong có chứng nhận không?", "Có. Khi bạn cần, LEC gửi chứng nhận hoàn thành khóa học của Lucina English Class qua email. Bạn chỉ cần nhắn LEC qua Zalo 0877.986.766.\nĐây là chứng nhận của trung tâm, không phải chứng chỉ ngoại ngữ quốc tế như IELTS hay TOEIC."], ["Lịch học thế nào? Có ca tối không?", "Có 13 ca mỗi ngày, mỗi ca 1,5 giờ:\n• Sáng: 5:00 · 6:30 · 8:00 · 9:30 · 11:00\n• Chiều: 12:30 · 14:00 · 15:30 · 17:00\n• Tối: 17:30 · 19:00 · 20:30 · 22:00\nBạn học 2 buổi/tuần, chọn 1 trong 3 cặp thứ: Thứ 2 & 5, Thứ 3 & 6 hoặc Thứ 4 & 7. Cần xếp ca linh hoạt hơn, bạn nhắn LEC nhé."], ["Lớp có bao nhiêu người?", "• Đời Sống: lớp nhóm 1-6, lớp 1-2 hoặc lớp 1-1.\n• Công Việc: lớp 1-2 hoặc lớp 1-1.\nLớp nhóm 1-6 được hưởng ưu đãi tốt nhất. Lớp 1-1 được cá nhân hóa theo mục tiêu và lịch của bạn."], ["Khi nào khai giảng?", "Lớp nhóm 1-6 khai giảng khi đủ bạn cùng level và cùng ca học. Nếu cần học gấp hơn, bạn chọn lớp 1-2 hoặc 1-1 để được xếp lịch nhanh hơn.\nBạn nhắn Zalo LEC 0877.986.766 để nhận lịch khai giảng gần nhất theo ca bạn muốn học."], ["Nếu tôi bận, lỡ một buổi thì sao?", "Mỗi buổi học đều có bản ghi hình, bạn xem lại bất cứ lúc nào, kèm tài liệu đầy đủ của buổi đó. Trợ giảng hỗ trợ bạn nắm lại phần đã lỡ.\nNếu phải tạm dừng việc học, bạn được bảo lưu 1 lần, cần báo LEC trong 2 buổi học đầu tiên của khóa, thời gian bảo lưu tối đa 6 tháng."], ["Tôi ở tỉnh xa, có học được không? LEC có lớp học trực tiếp không?", "Khóa học này là lớp online toàn quốc. Dù bạn ở tỉnh nào, bạn đều học trực tuyến cùng giáo viên LEC qua Google Meet hoặc Zoom, không cần đến trung tâm."], ["Tôi cần chuẩn bị gì để học online?", "• Điện thoại, máy tính bảng hoặc máy tính có kết nối mạng ổn định\n• Ứng dụng Google Meet hoặc Zoom (LEC gửi link lớp học cho bạn)\n• Nên dùng tai nghe có micro và ngồi ở nơi yên tĩnh để nghe rõ và luyện nói thoải mái"], ["Ai là người dạy?", "Bạn học với giáo viên chính của Lucina English Class, chuyên môn cao về Ngôn Ngữ Anh, trẻ trung, nhiệt huyết, tận tâm. Phần lớn giáo viên tốt nghiệp Ngoại thương (FTU), trình độ C1 hoặc IELTS 7.5, nhiều năm dạy người đi làm.\nCô Lucy thiết kế lộ trình và phụ trách chuyên môn. Bạn xem hồ sơ từng giáo viên ở phần “Đội ngũ giáo viên LEC”."], ["Ngoài giờ học, tôi được hỗ trợ thế nào?", "Bạn được hỗ trợ 24/7 với đội ngũ 3 kèm 1: giáo viên, trợ giảng và Cô Lucy. Mỗi lớp có nhóm chat chung để nhận tài liệu, nộp bài và hỏi bài.\nBạn còn được tham gia:\n• CLB Speak Up trọn đời: giao lưu, contest hàng tháng cùng giáo viên nước ngoài\n• Priority Ticket: vé ưu tiên khi học trong CLB, livestream và các hoạt động khác của trung tâm\n• Tài liệu đặc quyền: “21 Bài Ngữ Pháp” và “7 Bài Chuẩn Hóa Phát Âm” do Cô Lucy giảng dạy"], ["Học phí bao nhiêu? Mỗi level có giá khác nhau không?", "Mọi level, cả Đời Sống và Công Việc, dùng chung một bảng học phí (giá khuyến mại đang áp dụng):\n• Khóa 3 tháng (24 buổi): lớp 1-6 2.899.000đ · lớp 1-2 4.899.000đ · lớp 1-1 8.899.000đ\n• Combo khóa 6 tháng (48 buổi): lớp 1-6 5.680.000đ · lớp 1-2 9.680.000đ · lớp 1-1 17.680.000đ\n{{offerTerms}}"], ["Khóa 3 tháng và combo 6 tháng khác nhau thế nào?", "Khóa 3 tháng gồm 24 buổi, tương ứng 1 level. Combo khóa 6 tháng gồm 48 buổi, học phí tính ra mỗi buổi thấp hơn và ưu đãi 48h lớn hơn. Đăng ký combo 6 tháng ở cả lớp 1-6, 1-2 và 1-1 đều được tặng Set quà Lucina (sổ tay + bút, trị giá 159K)."], ["Hiện có những ưu đãi nào?", "• Đăng ký trong 48h kể từ lần đầu nhận tư vấn trên website này: giảm thêm theo bảng học phí.\n• Voucher 500K khi bạn nhắn LEC từ phiên livestream, trừ trực tiếp vào học phí.\n• Set quà Lucina (sổ tay + bút, trị giá 159K) khi đăng ký combo 6 tháng, áp dụng cho lớp 1-6, 1-2 và 1-1.\n• Quà tháng: đăng ký trước ngày 20 hằng tháng, nhận quà học phí và tự chọn 1 trong 2 quà: trọn bộ tài liệu học trên LIVE + Công thức luyện Speaking (~350K), hoặc 01 buổi Speaking Coaching cùng Ms. Lucy + đánh giá đầu vào (~500K)."], ["Tôi có thể đặt cọc trước không?", "Có. Bạn có thể đặt cọc 1.000.000đ để giữ chỗ, giữ ưu đãi và quà tặng. Phần học phí còn lại bạn hoàn thiện trước ngày khai giảng 2–3 ngày."], ["Chính sách hoàn học phí thế nào?", "Học phí không được hoàn dưới mọi hình thức nếu bạn dừng học đột ngột, không theo lộ trình đã cam kết ban đầu. Nếu cần tạm dừng, bạn dùng quyền bảo lưu (1 lần, báo trong 2 buổi học đầu, tối đa 6 tháng).\nVì vậy, Cô Lucy khuyên bạn làm bài test trình độ miễn phí trước để chọn đúng level ngay từ đầu."], ["Tôi muốn học thử trước khi đăng ký có được không?", "Hiện LEC chưa có buổi học thử riêng, vì:\n• Lớp nhỏ 1-6, 1-2 hoặc 1-1, giáo viên nghe và sửa cho từng người. Thêm một người vào học thử sẽ lấy bớt thời gian nói và được sửa của các bạn đang học\n• Mỗi buổi là một mắt xích trong lộ trình 24 buổi. Một buổi lẻ không cho bạn thấy được sự tiến bộ thật sau 3 tháng\n• Học thử ngẫu nhiên dễ vào sai trình độ. Bài test trình độ giúp bạn vào đúng level ngay từ đầu, hiệu quả hơn một buổi thử\n\nĐể cảm nhận cách dạy trước khi quyết định, bạn có thể:\n• Làm bài test trình độ miễn phí (20 câu tự động, có phần nghe và phát âm) để biết ngay level của mình\n• Học thử qua các buổi livestream miễn phí của Cô Lucy trên TikTok và Fanpage Lucina English Class\n• Học thử bài xây nền miễn phí trên kênh E4B của Cô Lucy", [["Làm bài test trình độ", "/bai-test"], ["Livestream trên TikTok", "https://www.tiktok.com/@tienganhchonguoibanron"], ["Livestream trên Fanpage", "https://www.facebook.com/lucinaenglishclass/"], ["Học thử trên kênh E4B", "https://www.facebook.com/profile.php?id=61596109800399"]]], ["Thanh toán và xác nhận đăng ký thế nào?", "Bạn điền form và bấm “Đăng ký ngay”: trang tạo mã QR có sẵn số tiền và mã đơn. Chuyển khoản xong, bạn gửi ảnh chụp chuyển khoản kèm mã đơn qua Zalo LEC 0877.986.766 để được xác nhận và xếp lớp.\nChuyển khoản tay: TPBank · 64615418888 · NGUYEN THI NHUNG · nội dung: Họ tên + SĐT + Tên khóa."]];
